[preset.0]
name="Web Preview"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json,assets/fonts/OFL.txt"
exclude_filter="captures/*,tests/*,test-results/*,*.log,*_test.gd,*_review.gd,export_templates/*,character-source-manifest.json,assets/*-prompt.txt,assets/npcs/*-prompt.txt,systems/encounters/review.png,matte-review.jpg"
export_path="../releases/knight-web/game.html"

[preset.0.options]
custom_template/debug=""
custom_template/release="../.tools/godot/web-templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<title>苍石庭院 · 试玩</title>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
